<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受付状況</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    h1 {
      font-size: 18px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin: 12px 0;
    }
    .label {
      color: #666;
      font-size: 14px;
    }
    .big {
      font-size: 52px;
      font-weight: bold;
      margin: 4px 0;
    }
    .sub {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
    }
    .sub div {
      font-size: 16px;
    }
    .updated {
      color: #999;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>受付状況</h1>

  <!-- ■要設定：Apps ScriptのURL -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxGUOuQSRSxoEo3aPM6haC114cW0h6k_By6CwvcHu9ZGsjKCP7dn8bCClu-Kmo1RDwDDg/exec";
  </script>

  <div class="card">
    <div class="label">受付済</div>
    <div class="big" id="checkedIn">-</div>
    <div class="label">／ 予定 <span id="totalExpected">-</span> 名</div>
  </div>

  <div class="card">
    <div class="sub">
      <div>予約経由<br><b id="reservationCheckedIn">-</b> 名</div>
      <div>当日券<br><b id="walkinCheckedIn">-</b> 名</div>
    </div>
  </div>

  <div class="updated" id="updated">読み込み中...</div>

  <script>
    function loadStats() {
      fetch(GAS_URL + "?action=stats")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          document.getElementById('checkedIn').textContent = data.checkedIn;
          document.getElementById('totalExpected').textContent = data.totalExpected;
          document.getElementById('reservationCheckedIn').textContent = data.reservationCheckedIn;
          document.getElementById('walkinCheckedIn').textContent = data.walkinCheckedIn;

          const now = new Date();
          document.getElementById('updated').textContent =
            '最終更新：' + now.toLocaleTimeString('ja-JP');
        })
        .catch(function () {
          document.getElementById('updated').textContent = '通信エラー。しばらくして再読み込みします';
        });
    }

    loadStats();
    setInterval(loadStats, 10000); // 10秒ごとに自動更新
  </script>

</body>
</html>
